name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0 markdown-it@14.1.0 mermaid@11.16.0 yjs@13.6.27
      - name: Run unit tests
        # After the install: some core tests use the real markdown-it and skip without it.
        run: node --test "tests/*.test.js"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fuzz the annotate flow
        run: node tests/fuzz-annotate.cjs 1 2000 3
      - name: Run Chromium end-to-end tests
        run: node tests/browser-e2e.cjs
      - name: Run relay protocol tests
        run: node --test relay/test/relay.test.cjs
      - name: Run shared-session end-to-end tests
        run: node tests/collab-e2e.cjs
